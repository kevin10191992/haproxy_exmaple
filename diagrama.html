<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAProxy Load Balancing - Arquitectura</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; font-family: 'Geist', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: clamp(1rem, 4vw, 2rem); }
  .container { max-width: 960px; width: 100%; }
  .header { margin-bottom: clamp(1rem, 4vw, 2rem); }
  .header p.eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; color: #4f5d75; margin-bottom: 8px; }
  .header h1 { font-family: 'Instrument Serif', serif; font-size: clamp(1.5rem, 4vw, 1.75rem); font-weight: 400; color: #2d3142; }
  .header h2 { font-family: 'Instrument Serif', serif; font-size: clamp(1rem, 3vw, 1.2rem); font-weight: 400; color: #4f5d75; margin-top: 4px; }
  svg { display: block; width: 100%; height: auto; max-width: 100%; }
  .legend { margin-top: 1rem; display: flex; gap: 1.5rem; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-family: 'Geist Mono', monospace; font-size: 8px; color: #4f5d75; letter-spacing: 0.06em; }
  .legend-dot { flex: 0 0 10px; width: 10px; height: 10px; border-radius: 50%; }
  @media (max-width: 480px) {
    .legend { gap: 0.75rem 1rem; }
    .legend-item { font-size: 7px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <p class="eyebrow">Deployment</p>
    <h1>HAProxy Load Balancing</h1>
    <h2>3 réplicas Flask API con health check y base de datos SQLite compartida</h2>
  </div>
  <svg viewBox="0 0 900 500" role="img" aria-labelledby="diag-title diag-desc">
    <title id="diag-title">HAProxy Load Balancing Architecture</title>
    <desc id="diag-desc">Diagrama de despliegue mostrando un cliente accediendo a 3 réplicas de una API Flask balanceadas por HAProxy, todas conectadas a una base de datos SQLite compartida.</desc>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <rect x="20" y="20" width="860" height="460" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="32" y="36" fill="#7a8399" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.14em" text-transform="uppercase">docker-compose</text>

    <line x1="260" y1="160" x2="390" y2="160" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
    <text x="325" y="150" fill="#2e5aa8" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">HTTP:80</text>

    <line x1="450" y1="200" x2="450" y2="230" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="465" y="220" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8">HTTP:5000</text>

    <line x1="450" y1="310" x2="220" y2="350" stroke="rgba(45,49,66,0.5)" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="450" y1="310" x2="450" y2="350" stroke="rgba(45,49,66,0.5)" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="450" y1="310" x2="680" y2="350" stroke="rgba(45,49,66,0.5)" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="560" y="300" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">HTTP:5000</text>

    <line x1="220" y1="380" x2="450" y2="420" stroke="rgba(45,49,66,0.5)" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="450" y1="380" x2="450" y2="420" stroke="rgba(45,49,66,0.5)" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="680" y1="380" x2="450" y2="420" stroke="rgba(45,49,66,0.5)" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="600" y="410" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">file:/data</text>

    <rect x="100" y="120" width="160" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="180" y="156" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cliente</text>
    <text x="180" y="172" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">browser</text>

    <rect x="390" y="120" width="120" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="450" y="156" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">HAProxy</text>
    <text x="450" y="172" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">load-balancer</text>
    <rect x="432" y="126" width="28" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-width="0.8"/>
    <text x="446" y="135" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="7" text-anchor="middle">v2.8</text>

    <rect x="340" y="230" width="220" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <rect x="348" y="236" width="28" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8"/>
    <text x="362" y="245" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="7" text-anchor="middle">v3.0</text>
    <text x="450" y="266" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">API Flask</text>
    <text x="450" y="282" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">replicas: 3</text>
    <rect x="568" y="236" width="64" height="12" rx="2" fill="#eb6c36" stroke="#eb6c36" stroke-width="0.8"/>
    <text x="600" y="245" fill="#ffffff" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">x3</text>

    <rect x="140" y="350" width="160" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="220" y="376" fill="#2d3142" font-family="'Geist', sans-serif" font-size="10" font-weight="600" text-anchor="middle">api1</text>
    <text x="220" y="392" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">:5000</text>

    <rect x="370" y="350" width="160" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="450" y="376" fill="#2d3142" font-family="'Geist', sans-serif" font-size="10" font-weight="600" text-anchor="middle">api2</text>
    <text x="450" y="392" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">:5000</text>

    <rect x="600" y="350" width="160" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="680" y="376" fill="#2d3142" font-family="'Geist', sans-serif" font-size="10" font-weight="600" text-anchor="middle">api3</text>
    <text x="680" y="392" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">:5000</text>

    <rect x="370" y="430" width="160" height="50" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="450" y="452" fill="#2d3142" font-family="'Geist', sans-serif" font-size="10" font-weight="600" text-anchor="middle">SQLite</text>
    <text x="450" y="468" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">app.db</text>
    <text x="450" y="477" fill="#7a8399" font-family="'Geist Mono', monospace" font-size="6.5" text-anchor="middle">shared volume</text>

  </svg>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#eb6c36"></div> Focal / Load Balancer</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4f5d75"></div> API Replica</div>
    <div class="legend-item"><div class="legend-dot" style="background:#2d3142"></div> Cliente</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4f5d75; border: 2px dashed #4f5d75; background: transparent;"></div> Store (SQLite)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#2e5aa8"></div> HTTP</div>
  </div>
</div>
</body>
</html>
