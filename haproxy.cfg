global
    log stdout format raw local0
    maxconn 200

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    option http-server-close
    option forwardfor

frontend http_front
    bind *:80
    default_backend api_servers

backend api_servers
    balance roundrobin
    option httpchk GET /health
    default-server inter 5s downinter 2s rise 2 fall 3 slowstart 60s
    server api1 api1:5000 check
    server api2 api2:5000 check
    server api3 api3:5000 check

listen stats
    bind *:8080
    stats enable
    stats uri /stats
    stats refresh 10s
